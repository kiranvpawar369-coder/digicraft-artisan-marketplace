<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiCraft - Admin Login</title>
    <link rel="stylesheet" href="adminlogin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <h1>Digi<span>Craft</span></h1>
                <p>Admin Portal</p>
            </div>
            <i class="fas fa-user-shield"></i>
        </div>
        
        <div class="login-form">
            <h2>Admin Login</h2>
            <p>Access your management dashboard</p>
            
            <form action="AdminLogin" method=post>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" name="aemail" id="username" placeholder="Enter admin username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="apass" id="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="login-btn">Login</button>
                
                <div class="security-notice">
                    <i class="fas fa-lock"></i>
                    <p>This is a secure admin portal. Unauthorized access is prohibited.</p>
                </div>
            </form>
        </div>
        
        <div class="login-footer">
            <p><a href="#">Contact Super Admin</a> if you need assistance</p>
        </div>
    </div>
</body>
</html>
