<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiCraft - Buyer Login</title>
    <link rel="stylesheet" href="buyerlogin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <h1>Digi<span>Craft</span></h1>
                <p>Buyer Portal</p>
            </div>
            <i class="fas fa-shopping-bag"></i>
        </div>
        
        <div class="login-form">
            <h2>Buyer Login</h2>
            <p>Access your shopping dashboard</p>
            
            <form action="BuyerLogin" method="post">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" name="bemail" id="email" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="bpass" id="password" placeholder="••••••••" required>
                </div>
                
                <div class="remember-forgot">
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>
                
                <button type="submit" class="login-btn">Login</button>
                
                <div class="divider">
                    <span>or</span>
                </div>
                
                <button type="button" class="social-login google">
                    <i class="fab fa-google"></i> Continue with Google
                </button>
                
                <button type="button" class="social-login facebook">
                    <i class="fab fa-facebook-f"></i> Continue with Facebook
                </button>
            </form>
        </div>
        
        <div class="login-footer">
            <p>New to DigiCraft? <a href="buyerregistration.html">Create an account</a></p>
        </div>
    </div>
</body>
</html>
